<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jeco</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="rule" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Brave</p>
          <h1>Jeco</h1>
        </div>
      </div>
      <button type="button" id="settings-toggle" class="text-button">Settings</button>
    </header>

    <section id="settings" class="settings" hidden>
      <label class="field">
        <span>OpenRouter key</span>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span>Model</span>
        <input id="model" type="text" spellcheck="false" />
      </label>
      <label class="field">
        <span>Backup model</span>
        <input id="backup-model" type="text" placeholder="optional backup model" spellcheck="false" />
      </label>
      <label class="field">
        <span>Base URL</span>
        <input id="base-url" type="text" placeholder="optional local base URL" spellcheck="false" />
      </label>
      <button type="button" id="save-key" class="button">Save</button>
      <p id="key-note" class="note"></p>

      <div class="sites-head">
        <h2>Sites</h2>
        <p>Jeco starts with none. Interaction is on. Posting stays off until you enable it.</p>
      </div>
      <form id="add-site" class="add-site">
        <input id="site-host" type="text" placeholder="youtube.com" spellcheck="false" />
        <button type="submit" class="button">Add</button>
      </form>
      <p id="site-note" class="note"></p>
      <ul id="sites" class="sites"></ul>
    </section>

    <ol id="steps" class="steps" aria-live="polite"></ol>
    <div id="log" class="log" aria-live="polite"></div>

    <section id="plan" class="plan" hidden>
      <h2>Plan</h2>
      <ol id="plan-lines"></ol>
      <div class="row">
        <button type="button" id="plan-start" class="button">Start</button>
        <button type="button" id="plan-cancel" class="button quiet">Cancel</button>
      </div>
    </section>

    <section id="confirm" class="confirm" hidden>
      <h2 id="confirm-title">Confirm</h2>
      <img id="confirm-image" alt="The control Jeco is about to use" hidden />
      <p id="confirm-text"></p>
      <div class="row">
        <button type="button" id="confirm-yes" class="button">Post it</button>
        <button type="button" id="confirm-no" class="button quiet">Don't do it</button>
      </div>
    </section>

    <ul id="saved-tasks" class="sites"></ul>

    <form id="composer" class="composer">
      <label class="field">
        <span>Task</span>
        <textarea id="task" rows="3" placeholder="Find a video, open a page, or draft a post"></textarea>
      </label>
      <label class="field" id="task-name-field" hidden>
        <span>Name</span>
        <input id="task-name" type="text" placeholder="Task name" spellcheck="false" />
      </label>
      <div class="row">
        <button type="submit" id="run" class="button">Run</button>
        <button type="button" id="stop" class="button quiet" hidden>Stop</button>
        <button type="button" id="save-task" class="button" hidden>Save task</button>
      </div>
    </form>
    <p id="foot" class="foot">Page text from each step is sent to OpenRouter. Logins stay in Brave.</p>
    <script src="panel.js"></script>
  </body>
</html>
